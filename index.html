<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, addDoc, collection,
    query, orderBy, onSnapshot, serverTimestamp, updateDoc, deleteDoc, getDocs,
    where, writeBatch, arrayUnion, arrayRemove, deleteField }

  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithCredential, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAlaJcAlbtWcFj-u3plcXctjxvUqZFWKgE",
    authDomain: "intranet-pringles.firebaseapp.com",
    projectId: "intranet-pringles",
    storageBucket: "intranet-pringles.firebasestorage.app",
    messagingSenderId: "1019491462392",
    appId: "1:1019491462392:web:ce778cf5333d37719cdf0d",
    measurementId: "G-70GBLXZC3Z"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const auth = getAuth(app);

  // ============ SEGUNDO PROYECTO: Portal de Jóvenes (scout-pringles) ============
  // Se usa para: 1) crear la autorización del chico cuando se lo carga con email en la Intranet,
  // 2) reflejar el 100% de una ceremonia (Promesa/Etapa/Especialidad) en su desarrollo.
  const scoutConfig = {
    apiKey: "AIzaSyAbNlr9T-q9QHosYX2UMziLQ2Qrl_yrQP8",
    authDomain: "scout-pringles.firebaseapp.com",
    projectId: "scout-pringles",
    storageBucket: "scout-pringles.firebasestorage.app",
    messagingSenderId: "655976644512",
    appId: "1:655976644512:web:2666d2483351087b866ec5",
    measurementId: "G-GEKS5046KG"
  };
  const scoutApp = initializeApp(scoutConfig, "portalJovenes");
  const scoutAuth = getAuth(scoutApp);
  const scoutDb = getFirestore(scoutApp);
  let scoutSesionOk = false;
  window._scoutSesionOk = () => scoutSesionOk;
  onAuthStateChanged(scoutAuth, (user) => { scoutSesionOk = !!user; });

  const ETAPAS_POR_RAMA_SCOUT = {
    Castores:   ["Ambientación","Recolectores","Constructores"],
    Manada:     ["Pata Tierna","Saltador","Rastreador","Cazador"],
    Scouts:     ["Pista","Rumbo","Senda","Travesía"],
    Caminantes: ["Tierra","Aire","Fuego","Agua"],
    Rovers:     ["Encuentro","Compromiso","Proyección"]
  };

  // ============ EMAILJS — completar con los datos de tu cuenta ============
  // 1. Service ID: EmailJS → Email Services
  // 2. Template ID: EmailJS → Email Templates (crear uno con las variables que se listan abajo)
  // 3. Public Key: EmailJS → Account → General
  const EMAILJS_PUBLIC_KEY  = "DenrUpVwH3era9YKa";
  const EMAILJS_SERVICE_ID  = "service_7k9myip";
  const EMAILJS_TEMPLATE_PROMESA = "template_43a6h7c";
  // El template de EmailJS debe usar estas variables:
  //   {{to_email}}      -> destinatario (uno de los jefes de esa rama)
  //   {{joven_nombre}}  -> nombre y apellido del joven
  //   {{rama}}          -> rama del joven
  //   {{fecha}}         -> fecha de la promesa
  //   {{marcado_por}}   -> nombre del dirigente que la marcó
  if (window.emailjs && EMAILJS_PUBLIC_KEY && !EMAILJS_PUBLIC_KEY.startsWith('PONÉ')) {
    window.emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
  }

  // ============ MÓDULO PRESENTES (sin login: usa un nombre guardado en el navegador) ============
  window.jovenesCache = [];
  let unsubJovenesListener = null;

  function nombreDirigente() {
    return localStorage.getItem('dirigente_nombre') || '';
  }

  window.guardarNombreDirigente = () => {
    const val = document.getElementById('dirigente-nombre-input').value.trim();
    localStorage.setItem('dirigente_nombre', val);
    actualizarEstadoDirigente();
  };

  function actualizarEstadoDirigente() {
    const nombre = nombreDirigente();
    const badge = document.getElementById('dirigente-nombre-badge');
    const input = document.getElementById('dirigente-nombre-input');
    const btn = document.getElementById('dirigente-nombre-btn');
    const conGoogle = typeof sesionEstado !== 'undefined' && sesionEstado !== 'anon';
    if (badge) badge.textContent = conGoogle ? `Identificado como: ${nombre} (cuenta de Google)` : (nombre ? ('Identificado como: ' + nombre) : 'Todavía no ingresaste tu nombre');
    if (input) { input.style.display = conGoogle ? 'none' : ''; if (nombre) input.value = nombre; }
    if (btn) btn.style.display = conGoogle ? 'none' : '';
    const ideaInput = document.getElementById('idea-nombre-input');
    if (ideaInput && nombre && !ideaInput.value) ideaInput.value = nombre;
  }

  window.calcularEdad = function calcularEdad(fechaISO) {
    if (!fechaISO) return null;
    const hoy = new Date();
    const nac = new Date(fechaISO + "T00:00:00");
    let edad = hoy.getFullYear() - nac.getFullYear();
    const m = hoy.getMonth() - nac.getMonth();
    if (m < 0 || (m === 0 && hoy.getDate() < nac.getDate())) edad--;
    return edad;
  }

  window.diasHastaCumple = function diasHastaCumple(fechaISO) {
    if (!fechaISO) return 999;
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const nac = new Date(fechaISO + "T00:00:00");
    let prox = new Date(hoy.getFullYear(), nac.getMonth(), nac.getDate());
    if (prox < hoy) prox = new Date(hoy.getFullYear()+1, nac.getMonth(), nac.getDate());
    return Math.round((prox - hoy) / 86400000);
  }

  // --- Cargar jóvenes (con o sin filtro de rama), en tiempo real ---
  window.cargarJovenes = () => {
    if (unsubJovenesListener) unsubJovenesListener();
    const ramaSel = document.getElementById("jovenes-rama-select")?.value || "";
    let q = ramaSel
      ? query(collection(db, "jovenes"), where("rama", "==", ramaSel), where("activo", "==", true), orderBy("apellido"))
      : query(collection(db, "jovenes"), where("activo", "==", true), orderBy("apellido"));
    unsubJovenesListener = onSnapshot(q, snap => {
      window.jovenesCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      window.renderJovenesLista();
      window.renderCumplesProximos();
    }, err => {
      console.error('Error cargando jóvenes:', err);
      const wrap = document.getElementById('jovenes-lista-wrap');
      if (wrap) wrap.innerHTML = `<p class="presentes-empty">⚠️ Error al cargar: ${err.message}</p>`;
    });
  };

  // --- Alta / edición de un joven ---
  window.guardarJoven = async (id, datos) => {
    if (id) {
      await updateDoc(doc(db, "jovenes", id), { ...datos, actualizadoEn: serverTimestamp() });
      return id;
    } else {
      const ref = await addDoc(collection(db, "jovenes"), {
        ...datos, activo: true, historialRamas: [{ rama: datos.rama, desde: new Date().toISOString().slice(0,10), hasta: null }],
        creadoEn: serverTimestamp(), actualizadoEn: serverTimestamp()
      });
      return ref.id;
    }
  };

  // Crea (o actualiza) la autorización del chico en scout-pringles, para que su perfil
  // se genere solo la primera vez que entre al Portal de Jóvenes con su cuenta de Google.
  window.preautorizarEnPortalJovenes = async (email, nombre, rama) => {
    if (!scoutSesionOk) return { ok: false, motivo: 'sin-sesion-portal' };
    try {
      const emailKey = email.replace(/\./g, "_");
      await setDoc(doc(scoutDb, "autorizados", emailKey), {
        email, nombre, rol: rama, aprobadoEn: serverTimestamp()
      }, { merge: true });
      return { ok: true };
    } catch (err) {
      return { ok: false, motivo: err.message };
    }
  };

  // Para jóvenes SIN email todavía: los empuja igual al Portal como un perfil "pendiente"
  // (con su nombre, rama y desarrollo en 0%), para que los dirigentes ya puedan verlos y
  // cargarles progreso. Cuando más adelante se le agregue el email, se le habilita el
  // login real (ver preautorizarEnPortalJovenes) — el perfil pendiente queda igual con lo
  // ya cargado, disponible para vincularlo a mano si hace falta.
  window.crearPerfilPendienteEnPortal = async (jovenIntranetId, nombre, rama) => {
    if (!scoutSesionOk) return { ok: false, motivo: 'sin-sesion-portal' };
    try {
      const perfilId = 'pendiente_' + jovenIntranetId;
      const ref = doc(scoutDb, "perfiles", perfilId);
      const snap = await getDoc(ref);
      if (snap.exists()) {
        // Ya existe: solo actualizamos nombre/rama por si cambiaron, sin pisar el desarrollo cargado.
        await updateDoc(ref, { nombre, rol: rama });
      } else {
        await setDoc(ref, {
          nombre, email: '', rol: rama, ramaAsignada: '', fotoPerfil: '',
          desarrollo: { porRama: { [rama]: { promesa: 0, etapas: {}, especialidades: [] } }, notas: [] },
          edad: '', isAdmin: false,
          pendienteVinculacion: true, intranetJovenId: jovenIntranetId,
          creadoEn: serverTimestamp()
        });
      }
      return { ok: true };
    } catch (err) {
      return { ok: false, motivo: err.message };
    }
  };

  // Actualiza la foto de perfil en el Portal de Jóvenes: si el chico ya inició sesión alguna
  // vez ahí, actualiza su perfil REAL (buscándolo por email); si no, la deja en su perfil
  // "pendiente" para que ya se vea entre el staff aunque todavía no tenga cuenta propia.
  window.actualizarFotoEnPortal = async (email, jovenIntranetId, fotoBase64) => {
    if (!scoutSesionOk) return { ok: false, motivo: 'sin-sesion-portal' };
    try {
      if (email) {
        const q = query(collection(scoutDb, "perfiles"), where("email", "==", email));
        const snap = await getDocs(q);
        if (!snap.empty) {
          await updateDoc(doc(scoutDb, "perfiles", snap.docs[0].id), { fotoPerfil: fotoBase64 });
          return { ok: true, actualizoReal: true };
        }
      }
      const perfilId = 'pendiente_' + jovenIntranetId;
      const ref = doc(scoutDb, "perfiles", perfilId);
      const pSnap = await getDoc(ref);
      if (pSnap.exists()) { await updateDoc(ref, { fotoPerfil: fotoBase64 }); return { ok: true, actualizoReal: false }; }
      return { ok: false, motivo: 'sin-perfil-todavia' };
    } catch (err) {
      return { ok: false, motivo: err.message };
    }
  };

  // Marca en la Intranet que este joven ya está sincronizado con el Portal de Jóvenes,
  // para que "Precargar todos" no lo vuelva a tocar innecesariamente la próxima vez.
  window.marcarJovenSincronizado = async (jovenId) => {
    try { await updateDoc(doc(db, "jovenes", jovenId), { portalSincronizado: true, portalSincronizadoEn: Date.now() }); }
    catch (e) { console.error('No se pudo marcar como sincronizado:', e); }
  };

  // --- Cambiar / trasladar de rama (individual) ---
  window.cambiarRamaJoven = async (id, ramaActual, ramaNueva) => {
    const jRef = doc(db, "jovenes", id);
    const snap = await getDoc(jRef);
    const historial = snap.data().historialRamas || [];
    const hoy = new Date().toISOString().slice(0,10);
    const cerrado = historial.map(h => h.hasta ? h : (h.rama === ramaActual ? { ...h, hasta: hoy } : h));
    cerrado.push({ rama: ramaNueva, desde: hoy, hasta: null });
    await updateDoc(jRef, { rama: ramaNueva, historialRamas: cerrado, actualizadoEn: serverTimestamp() });
  };

  // --- Traslado masivo (ej: toda una camada que sube de rama) ---
  window.trasladarMasivo = async (ids, ramaNueva) => {
    const batch = writeBatch(db);
    const hoy = new Date().toISOString().slice(0,10);
    for (const id of ids) {
      const jRef = doc(db, "jovenes", id);
      const snap = await getDoc(jRef);
      const data = snap.data();
      const historial = (data.historialRamas || []).map(h => h.hasta ? h : { ...h, hasta: hoy });
      historial.push({ rama: ramaNueva, desde: hoy, hasta: null });
      batch.update(jRef, { rama: ramaNueva, historialRamas: historial, actualizadoEn: serverTimestamp() });
    }
    await batch.commit();
  };

  // --- Baja lógica ---
  window.darDeBajaJoven = async (id) => {
    if (!confirm("¿Dar de baja a este joven? No se borran sus datos históricos.")) return;
    await updateDoc(doc(db, "jovenes", id), { activo: false, actualizadoEn: serverTimestamp() });
  };

  // --- Tomar lista: cargar jóvenes de la rama + su estado ya guardado para esa fecha (si existe) ---
  window.cargarListaAsistencia = async () => {
    const rama = document.getElementById("lista-rama-select").value;
    const fecha = document.getElementById("lista-fecha-input").value;
    const wrap = document.getElementById("lista-asistencia-wrap");
    if (!rama || !fecha) { wrap.innerHTML = `<p class="presentes-empty">Elegí rama y fecha para tomar lista.</p>`; return; }

    wrap.innerHTML = `<p class="presentes-empty">Cargando...</p>`;
    let jovenes, marcados = {};
    try {
      const qJ = query(collection(db, "jovenes"), where("rama", "==", rama), where("activo", "==", true), orderBy("apellido"));
      const snapJ = await getDocs(qJ);
      jovenes = snapJ.docs.map(d => ({ id: d.id, ...d.data() }));

      const qA = query(collection(db, "asistencias"), where("rama", "==", rama), where("fecha", "==", fecha));
      const snapA = await getDocs(qA);
      snapA.forEach(d => { marcados[d.data().jovenId] = d.data().presente; });
    } catch (err) {
      console.error('Error cargando lista:', err);
      wrap.innerHTML = `<p class="presentes-empty">⚠️ Error al cargar: ${err.message}</p>`;
      return;
    }

    if (jovenes.length === 0) {
      wrap.innerHTML = `<p class="presentes-empty">No hay jóvenes cargados en ${rama}.</p>`;
      return;
    }

    wrap.innerHTML = jovenes.map(j => `
      <div class="joven-check-row">
        <span class="nombre">${j.nombre} ${j.apellido}</span>
        <span class="edad-tag">${window.calcularEdad(j.fechaNacimiento) ?? "—"} años</span>
        <input type="checkbox" id="check-${j.id}" ${marcados[j.id] ? "checked" : ""}>
      </div>`).join("") +
      `<button class="btn-guardar-lista" onclick="guardarListaAsistencia('${rama}','${fecha}')">💾 Guardar asistencia</button>`;

    wrap.dataset.jovenesIds = JSON.stringify(jovenes.map(j => ({ id: j.id, nombre: `${j.nombre} ${j.apellido}` })));
  };

  window.guardarListaAsistencia = async (rama, fecha) => {
    const nombre = nombreDirigente();
    if (!nombre) { alert('Ingresá tu nombre arriba antes de guardar la lista.'); return; }
    const wrap = document.getElementById("lista-asistencia-wrap");
    const jovenes = JSON.parse(wrap.dataset.jovenesIds || "[]");
    const batch = writeBatch(db);
    jovenes.forEach(j => {
      const presente = document.getElementById(`check-${j.id}`).checked;
      const idDoc = `${rama}_${fecha}_${j.id}`;
      batch.set(doc(db, "asistencias", idDoc), {
        jovenId: j.id, jovenNombre: j.nombre, rama, fecha, presente,
        marcadoPor: nombre, marcadoEn: serverTimestamp()
      });
    });
    await batch.commit();
    alert("✅ Asistencia guardada.");
  };

  // --- Métricas: traer asistencias en rango de fechas y agregar por día ---
  window.obtenerAsistenciasRango = async (rama, desde, hasta) => {
    let q = rama
      ? query(collection(db, "asistencias"), where("rama", "==", rama), where("fecha", ">=", desde), where("fecha", "<=", hasta))
      : query(collection(db, "asistencias"), where("fecha", ">=", desde), where("fecha", "<=", hasta));
    const snap = await getDocs(q);
    return snap.docs.map(d => d.data());
  };

  // --- Importación masiva desde Excel: recibe un array de objetos ya validados ---
  window.confirmarImportacionExcel = async (filas) => {
    const CHUNK = 400; // Firestore permite hasta 500 operaciones por batch
    let importados = 0;
    for (let i = 0; i < filas.length; i += CHUNK) {
      const lote = filas.slice(i, i + CHUNK);
      const batch = writeBatch(db);
      lote.forEach(f => {
        const ref = doc(collection(db, "jovenes"));
        batch.set(ref, {
          nombre: f.nombre,
          apellido: f.apellido,
          fechaNacimiento: f.fechaNacimiento || "",
          rama: f.rama,
          contacto: f.contacto || "",
          activo: true,
          historialRamas: [{ rama: f.rama, desde: new Date().toISOString().slice(0,10), hasta: null }],
          creadoEn: serverTimestamp(),
          actualizadoEn: serverTimestamp()
        });
      });
      await batch.commit();
      importados += lote.length;
    }
    return importados;
  };

  // ============ TAREAS (colaborativo) ============
  let unsubTareasListener = null;

  window.iniciarTareas = () => {
    if (unsubTareasListener) return; // ya está escuchando
    const q = query(collection(db, "tareas"), orderBy("creadoEn", "desc"));
    unsubTareasListener = onSnapshot(q, snap => {
      const tareas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      window.renderTareas(tareas);
    }, err => {
      console.error('Error cargando tareas:', err);
      const cont = document.getElementById('tareas-lista-nuevo');
      if (cont) cont.innerHTML = `<p class="presentes-empty">⚠️ Error: ${err.message}</p>`;
    });
  };

  window.agregarTarea = async () => {
    const nombre = nombreDirigente();
    if (!nombre) { alert('Ingresá tu nombre arriba antes de agregar una tarea.'); return; }
    const input = document.getElementById('tarea-texto-input');
    const texto = input.value.trim();
    if (!texto) return;
    await addDoc(collection(db, "tareas"), {
      texto, estado: "Nuevo",
      creadoPor: nombre, creadoEn: serverTimestamp(),
      editadoPor: nombre, editadoEn: serverTimestamp()
    });
    input.value = '';
  };

  window.cambiarEstadoTarea = async (id, estadoNuevo) => {
    const nombre = nombreDirigente();
    if (!nombre) { alert('Ingresá tu nombre arriba antes de editar una tarea.'); return; }
    await updateDoc(doc(db, "tareas", id), {
      estado: estadoNuevo, editadoPor: nombre, editadoEn: serverTimestamp()
    });
  };

  window.eliminarTarea = async (id) => {
    if (!confirm('¿Eliminar esta tarea?')) return;
    await deleteDoc(doc(db, "tareas", id));
  };

  // ============ MURO DE IDEAS ============
  let unsubIdeasListener = null;

  window.iniciarMuroIdeas = () => {
    if (unsubIdeasListener) return;
    const q = query(collection(db, "muro_ideas"), orderBy("fecha", "desc"));
    unsubIdeasListener = onSnapshot(q, snap => {
      const ideas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      window.renderMuroIdeas(ideas);
    }, err => {
      console.error('Error cargando muro de ideas:', err);
      const cont = document.getElementById('muro-ideas-lista');
      if (cont) cont.innerHTML = `<p class="presentes-empty">⚠️ Error: ${err.m
